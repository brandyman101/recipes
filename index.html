<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Private family recipe collection.">
  <title>Brandel Family Recipes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a03d1a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff8f0' font-family='Georgia,serif'%3ER%3C/text%3E%3C/svg%3E">
  <script>
    /* Apply the saved theme before first paint (no flash). */
    try {
      if (localStorage.getItem('brandel-dark') === '1') document.documentElement.setAttribute('data-theme', 'dark');
      var _t = localStorage.getItem('brandel-theme');
      if (_t) document.documentElement.setAttribute('data-accent', _t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <header class="site-header no-print">
    <div class="header-inner">
      <a class="site-title" href="#/">Brandel Family Recipes</a>
      <button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><span class="theme-track"><span class="theme-knob">☀</span></span></button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">☰</button>
      <nav class="main-nav" id="main-nav" aria-label="Main">
        <a href="#/recipes" id="nav-recipes">Recipes</a>
        <a href="#/planner" id="nav-planner">Meal Planner</a>
        <a href="#/shopping" id="nav-shopping">Shopping List</a>
        <a href="#/circular" id="nav-circular">This Week at Aron's</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app">
    <noscript><p>Please enable JavaScript to use the recipe collection.</p></noscript>
    <!-- Skeleton shimmer: holds the page shape while recipes load; boot() replaces it. -->
    <div class="skel-grid" aria-hidden="true">
      <div class="skel-card"><div class="skel-thumb shimmer"></div><div class="skel-lines"><div class="skel-line shimmer" style="width:60%"></div><div class="skel-line shimmer" style="width:85%"></div><div class="skel-line shimmer" style="width:40%"></div></div></div>
      <div class="skel-card"><div class="skel-thumb shimmer"></div><div class="skel-lines"><div class="skel-line shimmer" style="width:55%"></div><div class="skel-line shimmer" style="width:90%"></div><div class="skel-line shimmer" style="width:45%"></div></div></div>
      <div class="skel-card"><div class="skel-thumb shimmer"></div><div class="skel-lines"><div class="skel-line shimmer" style="width:65%"></div><div class="skel-line shimmer" style="width:80%"></div><div class="skel-line shimmer" style="width:35%"></div></div></div>
      <div class="skel-card"><div class="skel-thumb shimmer"></div><div class="skel-lines"><div class="skel-line shimmer" style="width:50%"></div><div class="skel-line shimmer" style="width:88%"></div><div class="skel-line shimmer" style="width:42%"></div></div></div>
    </div>
  </main>

  <footer class="site-footer no-print">
    brandel family recipes — please don't share
  </footer>

  <script src="app.js?v=20261110e"></script>
</body>
</html>
